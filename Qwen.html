<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pyCodeCamp — Полный курс Python</title>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a23;
    --bg-light: #1b1b32;
    --bg-lighter: #2a2a40;
    --text: #dfdfe0;
    --text-dim: #a0a0b0;
    --accent: #f1be32;
    --accent-hover: #ffbf00;
    --green: #acd157;
    --red: #e74c3c;
    --blue: #4c9aff;
    --border: #3d3d56;
  }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }
  header {
    background: var(--bg-light);
    border-bottom: 2px solid var(--accent);
    padding: 12px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 22px;
    font-weight: bold;
    color: var(--accent);
  }
  .logo-icon {
    width: 36px; height: 36px;
    background: var(--accent);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: var(--bg);
    font-weight: 900;
    font-size: 20px;
  }
  .header-stats {
    display: flex;
    gap: 20px;
    align-items: center;
    font-size: 14px;
  }
  .stat {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .stat-value {
    color: var(--accent);
    font-weight: bold;
  }
  .container {
    display: grid;
    grid-template-columns: 280px 1fr;
    min-height: calc(100vh - 62px);
  }
  aside {
    background: var(--bg-light);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    max-height: calc(100vh - 62px);
    position: sticky;
    top: 62px;
  }
  .aside-title {
    padding: 16px 20px;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-dim);
    border-bottom: 1px solid var(--border);
  }
  .lesson-list {
    list-style: none;
    padding: 8px 0;
  }
  .lesson-item {
    padding: 10px 20px;
    cursor: pointer;
    border-left: 3px solid transparent;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    transition: all 0.2s;
  }
  .lesson-item:hover {
    background: var(--bg-lighter);
  }
  .lesson-item.active {
    background: var(--bg-lighter);
    border-left-color: var(--accent);
    color: var(--accent);
  }
  .lesson-item.completed .lesson-check {
    color: var(--green);
  }
  .lesson-check {
    width: 18px;
    height: 18px;
    border: 2px solid var(--border);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    flex-shrink: 0;
  }
  .lesson-item.completed .lesson-check {
    border-color: var(--green);
    background: var(--green);
    color: var(--bg);
  }
  .lesson-num {
    color: var(--text-dim);
    font-size: 12px;
    min-width: 24px;
  }
  main {
    padding: 24px;
    overflow-y: auto;
  }
  .lesson-header {
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .lesson-tag {
    display: inline-block;
    background: var(--accent);
    color: var(--bg);
    padding: 3px 10px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: bold;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .lesson-title {
    font-size: 28px;
    margin-bottom: 8px;
    color: var(--text);
  }
  .lesson-progress {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: var(--text-dim);
    margin-top: 10px;
  }
  .progress-bar {
    flex: 1;
    height: 6px;
    background: var(--bg-lighter);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--green);
    transition: width 0.3s;
  }
  .content {
    max-width: 900px;
    line-height: 1.7;
    font-size: 16px;
  }
  .content h2 {
    margin: 24px 0 12px;
    color: var(--accent);
    font-size: 22px;
  }
  .content h3 {
    margin: 18px 0 10px;
    color: var(--blue);
    font-size: 18px;
  }
  .content p { margin-bottom: 14px; }
  .content ul, .content ol {
    margin: 10px 0 14px 24px;
  }
  .content li { margin-bottom: 6px; }
  .content code {
    background: var(--bg-lighter);
    padding: 2px 6px;
    border-radius: 3px;
    font-family: 'Consolas', monospace;
    color: var(--accent);
    font-size: 14px;
  }
  .content pre {
    background: var(--bg-light);
    border-left: 3px solid var(--accent);
    padding: 14px 18px;
    border-radius: 4px;
    overflow-x: auto;
    margin: 14px 0;
  }
  .content pre code {
    background: none;
    padding: 0;
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
  }
  .info-box {
    background: rgba(76, 154, 255, 0.1);
    border-left: 3px solid var(--blue);
    padding: 12px 16px;
    margin: 16px 0;
    border-radius: 4px;
  }
  .info-box strong { color: var(--blue); }
  .editor-section {
    margin-top: 30px;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }
  .editor-tabs {
    display: flex;
    background: var(--bg-light);
    border-bottom: 1px solid var(--border);
  }
  .editor-tab {
    padding: 10px 18px;
    cursor: pointer;
    font-size: 14px;
    border-right: 1px solid var(--border);
    color: var(--text-dim);
  }
  .editor-tab.active {
    background: var(--bg-lighter);
    color: var(--accent);
  }
  .editor-wrapper {
    position: relative;
    background: var(--bg-light);
  }
  #codeEditor {
    width: 100%;
    min-height: 200px;
    background: var(--bg-light);
    color: var(--text);
    border: none;
    padding: 16px;
    font-family: 'Consolas', 'Monaco', monospace;
    font-size: 14px;
    line-height: 1.5;
    resize: vertical;
    outline: none;
    tab-size: 4;
  }
  .editor-actions {
    padding: 12px;
    background: var(--bg-light);
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .btn {
    padding: 10px 20px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.2s;
    font-family: inherit;
  }
  .btn-primary {
    background: var(--accent);
    color: var(--bg);
  }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-secondary {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover {
    background: var(--bg-lighter);
    border-color: var(--accent);
  }
  .btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .output-section {
    margin-top: 16px;
    background: var(--bg-light);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }
  .output-header {
    padding: 10px 16px;
    background: var(--bg-lighter);
    font-size: 13px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-dim);
    border-bottom: 1px solid var(--border);
  }
  .output-content {
    padding: 14px 16px;
    font-family: 'Consolas', monospace;
    font-size: 14px;
    min-height: 60px;
    white-space: pre-wrap;
    max-height: 300px;
    overflow-y: auto;
  }
  .output-line { margin-bottom: 4px; }
  .output-line.error { color: var(--red); }
  .output-line.success { color: var(--green); }
  .output-line.info { color: var(--blue); }
  .tests-section {
    margin-top: 16px;
    background: var(--bg-light);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }
  .tests-header {
    padding: 10px 16px;
    background: var(--bg-lighter);
    font-size: 13px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-dim);
    border-bottom: 1px solid var(--border);
  }
  .test-item {
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
  }
  .test-item:last-child { border-bottom: none; }
  .test-icon {
    width: 20px; height: 20px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
    font-weight: bold;
    flex-shrink: 0;
  }
  .test-icon.pending { border: 2px solid var(--border); color: transparent; }
  .test-icon.pass { background: var(--green); color: var(--bg); }
  .test-icon.fail { background: var(--red); color: white; }
  .test-text.pass { color: var(--green); }
  .test-text.fail { color: var(--red); }
  .loading-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(10, 10, 35, 0.95);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1000;
  }
  .spinner {
    width: 50px; height: 50px;
    border: 4px solid var(--bg-lighter);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text {
    color: var(--text);
    font-size: 16px;
  }
  .loading-sub {
    color: var(--text-dim);
    font-size: 13px;
    margin-top: 8px;
  }
  .certificate-modal {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(10, 10, 35, 0.9);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 999;
  }
  .certificate-modal.show { display: flex; }
  .certificate {
    background: linear-gradient(135deg, var(--bg-light) 0%, var(--bg-lighter) 100%);
    border: 3px solid var(--accent);
    border-radius: 12px;
    padding: 40px;
    max-width: 600px;
    text-align: center;
    box-shadow: 0 0 40px rgba(241, 190, 50, 0.3);
  }
  .certificate h2 {
    color: var(--accent);
    font-size: 32px;
    margin-bottom: 16px;
  }
  .certificate p { margin-bottom: 12px; }
  .certificate .cert-name {
    font-size: 24px;
    color: var(--accent);
    margin: 20px 0;
    font-weight: bold;
  }
  .menu-toggle {
    display: none;
    background: none;
    border: none;
    color: var(--text);
    font-size: 24px;
    cursor: pointer;
  }
  @media (max-width: 768px) {
    .container { grid-template-columns: 1fr; }
    aside {
      position: fixed;
      top: 62px;
      left: -100%;
      width: 280px;
      height: calc(100vh - 62px);
      transition: left 0.3s;
      z-index: 50;
    }
    aside.open { left: 0; }
    .menu-toggle { display: block; }
    .header-stats { font-size: 12px; gap: 10px; }
    .lesson-title { font-size: 22px; }
  }
  .hint-btn {
    margin-top: 10px;
    color: var(--blue);
    cursor: pointer;
    font-size: 13px;
    display: inline-block;
  }
  .hint-btn:hover { text-decoration: underline; }
  .hint-box {
    background: rgba(241, 190, 50, 0.1);
    border-left: 3px solid var(--accent);
    padding: 12px 16px;
    margin: 12px 0;
    border-radius: 4px;
    display: none;
  }
  .hint-box.show { display: block; }
  .welcome-hero {
    text-align: center;
    padding: 40px 20px;
    background: linear-gradient(135deg, var(--bg-light) 0%, var(--bg-lighter) 100%);
    border-radius: 8px;
    margin-bottom: 30px;
  }
  .welcome-hero h1 {
    color: var(--accent);
    font-size: 36px;
    margin-bottom: 16px;
  }
  .welcome-hero p {
    color: var(--text-dim);
    font-size: 16px;
    max-width: 600px;
    margin: 0 auto 20px;
  }
</style>
</head>
<body>

<div id="loadingOverlay" class="loading-overlay">
  <div class="spinner"></div>
  <div class="loading-text">Загрузка Python-интерпретатора...</div>
  <div class="loading-sub">Pyodide загружается (~10 МБ). Это может занять некоторое время.</div>
</div>

<header>
  <button class="menu-toggle" onclick="toggleMenu()">☰</button>
  <div class="logo">
    <div class="logo-icon">🐍</div>
    <div>pyCodeCamp</div>
  </div>
  <div class="header-stats">
    <div class="stat">🔥 Серия: <span class="stat-value" id="streakStat">0</span></div>
    <div class="stat">✅ Пройдено: <span class="stat-value" id="completedStat">0</span>/<span id="totalStat">0</span></div>
    <button class="btn btn-secondary" style="padding:6px 12px;font-size:12px;" onclick="resetProgress()">Сброс</button>
  </div>
</header>

<div class="container">
  <aside id="sidebar">
    <div class="aside-title">📚 Программа курса</div>
    <ul class="lesson-list" id="lessonList"></ul>
  </aside>
  <main id="mainContent"></main>
</div>

<div class="certificate-modal" id="certModal">
  <div class="certificate">
    <h2>🎉 Поздравляем!</h2>
    <p>Вы успешно завершили полный курс Python</p>
    <div class="cert-name">Сертификат pyCodeCamp</div>
    <p>«Python Developer Certification»</p>
    <p style="color:var(--text-dim);font-size:13px;">Выдан: <span id="certDate"></span></p>
    <button class="btn btn-primary" style="margin-top:20px;" onclick="document.getElementById('certModal').classList.remove('show')">Закрыть</button>
  </div>
</div>

<script>
// ============ ДАННЫЕ КУРСА ============
const lessons = [
  {
    id: 1,
    title: "Привет, Python!",
    tag: "Введение",
    content: `
      <h2>Добро пожаловать в мир Python!</h2>
      <p>Python — один из самых популярных языков программирования в мире. Он используется в веб-разработке, анализе данных, машинном обучении, автоматизации и многом другом.</p>
      <h3>Ваша первая программа</h3>
      <p>Традиционно изучение любого языка начинается с программы, которая выводит на экран сообщение <code>"Hello, World!"</code>. В Python это делается с помощью функции <code>print()</code>.</p>
      <pre><code>print("Hello, World!")</code></pre>
      <p>Функция <code>print()</code> выводит текст (строку) в консоль. Строки в Python заключаются в кавычки — одинарные <code>'</code> или двойные <code>"</code>.</p>
      <div class="info-box"><strong>💡 Совет:</strong> Попробуйте изменить текст в кавычках и запустите код снова.</div>
    `,
    initialCode: `# Выведите "Hello, World!" на экран
`,
    tasks: [
      { text: 'Выведите на экран строку "Hello, World!"', check: (out) => out.trim() === "Hello, World!" },
      { text: 'Выведите на экран строку "I love Python"', check: (out) => out.includes("I love Python") }
    ],
    hint: 'Используйте print("Hello, World!") и print("I love Python")'
  },
  {
    id: 2,
    title: "Переменные",
    tag: "Основы",
    content: `
      <h2>Переменные в Python</h2>
      <p>Переменная — это именованная область памяти, которая хранит значение. В Python не нужно объявлять тип переменной — он определяется автоматически.</p>
      <pre><code>name = "Alice"
age = 25
height = 1.68
is_student = True

print(name)
print(age)</code></pre>
      <h3>Правила именования</h3>
      <ul>
        <li>Имя может содержать буквы, цифры и символ подчёркивания <code>_</code></li>
        <li>Не может начинаться с цифры</li>
        <li>Регистр имеет значение: <code>Name</code> и <code>name</code> — разные переменные</li>
        <li>Нельзя использовать зарезервированные слова (<code>if</code>, <code>for</code>, <code>class</code> и др.)</li>
      </ul>
      <h3>Множественное присваивание</h3>
      <pre><code>x, y, z = 1, 2, 3
a = b = c = 0</code></pre>
    `,
    initialCode: `# Создайте переменную name со значением "Python"
# Создайте переменную year со значением 2026
# Выведите обе переменные
`,
    tasks: [
      { text: 'Создайте переменную name со значением "Python"', check: (out, vars) => vars.name === "Python" },
      { text: 'Создайте переменную year со значением 2026', check: (out, vars) => vars.year === 2026 },
      { text: 'Выведите обе переменные через print', check: (out) => out.includes("Python") && out.includes("2026") }
    ],
    hint: 'name = "Python"\nyear = 2026\nprint(name)\nprint(year)'
  },
  {
    id: 3,
    title: "Типы данных",
    tag: "Основы",
    content: `
      <h2>Основные типы данных</h2>
      <p>В Python есть несколько встроенных типов данных:</p>
      <ul>
        <li><code>int</code> — целые числа: <code>42</code>, <code>-7</code>, <code>0</code></li>
        <li><code>float</code> — дробные числа: <code>3.14</code>, <code>-0.5</code></li>
        <li><code>str</code> — строки: <code>"Hello"</code>, <code>'World'</code></li>
        <li><code>bool</code> — логический тип: <code>True</code> или <code>False</code></li>
        <li><code>NoneType</code> — отсутствие значения: <code>None</code></li>
      </ul>
      <h3>Функция type()</h3>
      <p>Чтобы узнать тип переменной, используйте <code>type()</code>:</p>
      <pre><code>x = 42
print(type(x))  # &lt;class 'int'&gt;

y = 3.14
print(type(y))  # &lt;class 'float'&gt;</code></pre>
      <h3>Преобразование типов</h3>
      <pre><code>x = int("42")     # строка → число
y = str(100)      # число → строка
z = float("3.14") # строка → дробное число</code></pre>
    `,
    initialCode: `# Создайте переменные разных типов
# и выведите их типы через type()
`,
    tasks: [
      { text: 'Создайте целочисленную переменную age', check: (out, vars) => typeof vars.age === 'number' && Number.isInteger(vars.age) },
      { text: 'Создайте строковую переменную name', check: (out, vars) => typeof vars.name === 'string' },
      { text: 'Создайте переменную-дробное число price', check: (out, vars) => typeof vars.price === 'number' && !Number.isInteger(vars.price) },
      { text: 'Выведите типы всех трёх переменных', check: (out) => out.includes("int") && out.includes("str") && out.includes("float") }
    ],
    hint: 'age = 25\nname = "Alice"\nprice = 9.99\nprint(type(age))\nprint(type(name))\nprint(type(price))'
  },
  {
    id: 4,
    title: "Числа и математика",
    tag: "Основы",
    content: `
      <h2>Арифметические операции</h2>
      <p>Python поддерживает все стандартные математические операции:</p>
      <pre><code>a = 10
b = 3

print(a + b)   # 13  — сложение
print(a - b)   # 7   — вычитание
print(a * b)   # 30  — умножение
print(a / b)   # 3.333... — деление (всегда float)
print(a // b)  # 3   — целочисленное деление
print(a % b)   # 1   — остаток от деления
print(a ** b)  # 1000 — возведение в степень</code></pre>
      <h3>Приоритет операций</h3>
      <p>Как в математике: сначала <code>**</code>, потом <code>* / // %</code>, затем <code>+ -</code>. Скобки меняют порядок:</p>
      <pre><code>result = 2 + 3 * 4      # 14
result = (2 + 3) * 4    # 20</code></pre>
      <h3>Встроенные функции</h3>
      <pre><code>print(abs(-5))    # 5 — модуль
print(round(3.7)) # 4 — округление
print(max(1, 5, 3)) # 5
print(min(1, 5, 3)) # 1</code></pre>
    `,
    initialCode: `# Вычислите площадь круга с радиусом 5
# Формула: S = π * r²
# Используйте pi = 3.14159
# Выведите результат

// ============ СОСТОЯНИЕ ПРИЛОЖЕНИЯ ============
let pyodide = null;
let currentLesson = 0;
let progress = JSON.parse(localStorage.getItem('pycode_progress') || '{}');
let streak = parseInt(localStorage.getItem('pycode_streak') || '0');

// ============ ИНИЦИАЛИЗАЦИЯ PYODIDE ============
async function initPyodide() {
  try {
    pyodide = await loadPyodide();
    await pyodide.loadPackage('micropip');
    document.getElementById('loadingOverlay').style.display = 'none';
    renderApp();
  } catch (e) {
    document.querySelector('.loading-text').textContent = 'Ошибка загрузки Pyodide';
    document.querySelector('.loading-sub').textContent = e.message;
  }
}

// ============ РЕНДЕРИНГ ============
function renderApp() {
  renderSidebar();
  renderLesson(currentLesson);
  updateStats();
}

function renderSidebar() {
  const list = document.getElementById('lessonList');
  list.innerHTML = lessons.map((l, i) => {
    const completed = progress[l.id]?.completed;
    const active = i === currentLesson;
    return `
      <li class="lesson-item ${active ? 'active' : ''} ${completed ? 'completed' : ''}" onclick="selectLesson(${i})">
        <div class="lesson-check">${completed ? '✓' : ''}</div>
        <span class="lesson-num">${String(i+1).padStart(2,'0')}</span>
        <span>${l.title}</span>
      </li>
    `;
  }).join('');
}

function renderLesson(idx) {
  const lesson = lessons[idx];
  const prog = progress[lesson.id] || { completed: false, tests: [] };
  const main = document.getElementById('mainContent');
  
  main.innerHTML = `
    <div class="lesson-header">
      <span class="lesson-tag">${lesson.tag}</span>
      <h1 class="lesson-title">${lesson.title}</h1>
      <div class="lesson-progress">
        <span>Задание ${idx+1} из ${lessons.length}</span>
        <div class="progress-bar">
          <div class="progress-fill" style="width:${(idx+1)/lessons.length*100}%"></div>
        </div>
      </div>
    </div>
    <div class="content">
      ${lesson.content}
      <span class="hint-btn" onclick="toggleHint()">💡 Показать подсказку</span>
      <div class="hint-box" id="hintBox">${lesson.hint.replace(/\n/g,'<br>')}</div>
    </div>
    <div class="editor-section">
      <div class="editor-tabs">
        <div class="editor-tab active">📝 Редактор кода</div>
      </div>
      <div class="editor-wrapper">
        <textarea id="codeEditor" spellcheck="false">${lesson.initialCode}</textarea>
      </div>
      <div class="editor-actions">
        <button class="btn btn-primary" onclick="runCode()">▶ Запустить</button>
        <button class="btn btn-primary" onclick="checkSolution()">✓ Проверить решение</button>
        <button class="btn btn-secondary" onclick="resetCode()">↺ Сбросить</button>
        ${idx > 0 ? `<button class="btn btn-secondary" onclick="selectLesson(${idx-1})">← Назад</button>` : ''}
        ${idx < lessons.length-1 ? `<button class="btn btn-secondary" onclick="selectLesson(${idx+1})">Далее →</button>` : ''}
      </div>
    </div>
    <div class="output-section">
      <div class="output-header">📤 Вывод программы</div>
      <div class="output-content" id="output"><span class="output-line info">Нажмите "Запустить" для выполнения кода</span></div>
    </div>
    <div class="tests-section">
      <div class="tests-header">✅ Тесты (${lesson.tasks.length})</div>
      <div id="testsList">
        ${lesson.tasks.map((t, i) => `
          <div class="test-item">
            <div class="test-icon pending" id="test-icon-${i}"></div>
            <span class="test-text" id="test-text-${i}">${t.text}</span>
          </div>
        `).join('')}
      </div>
    </div>
  `;
  
  // Восстановление сохранённого кода
  const savedCode = progress[lesson.id]?.code;
  if (savedCode) {
    document.getElementById('codeEditor').value = savedCode;
  }
  
  // Восстановление результатов тестов
  if (prog.tests && prog.tests.length) {
    prog.tests.forEach((passed, i) => {
      if (i < lesson.tasks.length) {
        const icon = document.getElementById(`test-icon-${i}`);
        const text = document.getElementById(`test-text-${i}`);
        if (icon && text) {
          icon.className = `test-icon ${passed ? 'pass' : 'fail'}`;
          icon.textContent = passed ? '✓' : '✗';
          text.className = `test-text ${passed ? 'pass' : 'fail'}`;
        }
      }
    });
  }
  
  // Tab в textarea
  document.getElementById('codeEditor').addEventListener('keydown', (e) => {
    if (e.key === 'Tab') {
      e.preventDefault();
      const start = e.target.selectionStart;
      const end = e.target.selectionEnd;
      e.target.value = e.target.value.substring(0, start) + '    ' + e.target.value.substring(end);
      e.target.selectionStart = e.target.selectionEnd = start + 4;
    }
  });
}

function selectLesson(idx) {
  currentLesson = idx;
  renderSidebar();
  renderLesson(idx);
  document.getElementById('sidebar').classList.remove('open');
  window.scrollTo(0, 0);
}

function toggleHint() {
  document.getElementById('hintBox').classList.toggle('show');
}

function toggleMenu() {
  document.getElementById('sidebar').classList.toggle('open');
}

function resetCode() {
  const lesson = lessons[currentLesson];
  document.getElementById('codeEditor').value = lesson.initialCode;
}

// ============ ВЫПОЛНЕНИЕ КОДА ============
async function runCode() {
  const code = document.getElementById('codeEditor').value;
  const output = document.getElementById('output');
  output.innerHTML = '<span class="output-line info">⏳ Выполнение...</span>';
  
  try {
    pyodide.runPython(`
import sys
from io import StringIO
sys.stdout = StringIO()
sys.stderr = StringIO()
`);
    
    await pyodide.runPythonAsync(code);
    
    const stdout = pyodide.runPython('sys.stdout.getvalue()');
    const stderr = pyodide.runPython('sys.stderr.getvalue()');
    
    let html = '';
    if (stdout) {
      html += stdout.split('\n').filter(l => l !== '').map(l => 
        `<span class="output-line">${escapeHtml(l)}</span>`
      ).join('');
    }
    if (stderr) {
      html += `<span class="output-line error">${escapeHtml(stderr)}</span>`;
    }
    if (!html) html = '<span class="output-line info">✓ Код выполнен (нет вывода)</span>';
    output.innerHTML = html;
    
    // Сохранить код
    saveCode();
  } catch (e) {
    output.innerHTML = `<span class="output-line error">❌ Ошибка: ${escapeHtml(e.message)}</span>`;
  } finally {
    try {
      pyodide.runPython(`
import sys
sys.stdout = sys.__stdout__
sys.stderr = sys.__stderr__
`);
    } catch(e) {}
  }
}

from io import StringIO
sys.stdout = StringIO()
sys.stderr = StringIO()
`);
    
    await pyodide.runPythonAsync(code);
    
    const stdout = pyodide.runPython('sys.stdout.getvalue()');
    
    // Получить переменные из Python
    const varsCode = `
import json
__vars__ = {}
for k, v in list(globals().items()):
    if not k.startswith('_') and k not in ('json', 'sys', 'StringIO', '__vars__'):
        try:
            if callable(v) and not isinstance(v, type):
                # Функция — сериализуем через JSON
                pass
            else:
                json.dumps(v)
                __vars__[k] = v
        except:
            pass
`;
    pyodide.runPython(varsCode);
    const pyVars = pyodide.globals.get('__vars__');
    const vars = pyVars.toJs ? pyVars.toJs({dict_converter: Object.fromEntries}) : {};
    
    // Сохранить функции отдельно
    const funcNames = [];
    pyodide.runPython(`
__funcs__ = [k for k, v in globals().items() if callable(v) and not isinstance(v, type) and not k.startswith('_') and k not in ('json', 'print', 'input', 'range', 'len', 'type', 'int', 'str', 'float', 'list', 'dict', 'set', 'tuple', 'bool', 'sum', 'max', 'min', 'sorted', 'abs', 'round', 'enumerate', 'zip', 'map', 'filter')]
`);
    const funcsList = pyodide.globals.get('__funcs__');
    const funcs = funcsList.toJs ? funcsList.toJs() : [];
    
    for (const fname of funcs) {
      try {
        const fn = pyodide.globals.get(fname);
        vars[fname] = fn;
      } catch(e) {}
    }
    
    // Также классы
    pyodide.runPython(`
__classes__ = [k for k, v in globals().items() if isinstance(v, type) and not k.startswith('_')]
`);
    const classesList = pyodide.globals.get('__classes__');
    const classes = classesList.toJs ? classesList.toJs() : [];
    for (const cname of classes) {
      try {
        vars[cname] = pyodide.globals.get(cname);
      } catch(e) {}
    }
    
    // Проверить тесты
    const results = [];
    let allPassed = true;
    
    for (let i = 0; i < lesson.tasks.length; i++) {
      const task = lesson.tasks[i];
      const icon = document.getElementById(`test-icon-${i}`);
      const text = document.getElementById(`test-text-${i}`);
      
      let passed = false;
      try {
        passed = task.check(stdout, vars, code);
      } catch (e) {
        passed = false;
      }
      
      results.push(passed);
      icon.className = `test-icon ${passed ? 'pass' : 'fail'}`;
      icon.textContent = passed ? '✓' : '✗';
      text.className = `test-text ${passed ? 'pass' : 'fail'}`;
      
      if (!passed) allPassed = false;
    }
    
    // Вывод программы
    let html = '';
    if (stdout) {
      html += stdout.split('\n').filter(l => l !== '').map(l => 
        `<span class="output-line">${escapeHtml(l)}</span>`
      ).join('');
    }
    if (allPassed) {
      html += `<span class="output-line success">🎉 Все тесты пройдены! Отличная работа!</span>`;
    } else {
      html += `<span class="output-line error">❌ Некоторые тесты не пройдены. Попробуйте ещё раз.</span>`;
    }
    output.innerHTML = html;
    
    // Сохранить прогресс
    if (allPassed) {
      if (!progress[lesson.id]?.completed) {
        streak++;
        localStorage.setItem('pycode_streak', streak);
      }
      progress[lesson.id] = { completed: true, tests: results, code };
      localStorage.setItem('pycode_progress', JSON.stringify(progress));
      renderSidebar();
      updateStats();
      
      // Если все уроки пройдены — показать сертификат
      if (Object.keys(progress).length === lessons.length && 
          Object.values(progress).every(p => p.completed)) {
        setTimeout(showCertificate, 1000);
      }
    } else {
      progress[lesson.id] = { ...progress[lesson.id], tests: results, code };
      localStorage.setItem('pycode_progress', JSON.stringify(progress));
    }
    
  } catch (e) {
    output.innerHTML = `<span class="output-line error">❌ Ошибка выполнения: ${escapeHtml(e.message)}</span>`;
  } finally {
    try {
      pyodide.runPython(`
import sys
sys.stdout = sys.__stdout__
sys.stderr = sys.__stderr__
`);
    } catch(e) {}
  }
}

function saveCode() {
  const code = document.getElementById('codeEditor').value;
  const lesson = lessons[currentLesson];
  progress[lesson.id] = { ...progress[lesson.id], code };
  localStorage.setItem('pycode_progress', JSON.stringify(progress));
}

function updateStats() {
  const completed = Object.values(progress).filter(p => p.completed).length;
  document.getElementById('completedStat').textContent = completed;
  document.getElementById('totalStat').textContent = lessons.length;
  document.getElementById('streakStat').textContent = streak;
}

function showCertificate() {
  document.getElementById('certDate').textContent = new Date().toLocaleDateString('ru-RU', {
    year: 'numeric', month: 'long', day: 'numeric'
  });
  document.getElementById('certModal').classList.add('show');
}

function resetProgress() {
  if (confirm('Сбросить весь прогресс? Это действие нельзя отменить.')) {
    progress = {};
    streak = 0;
    localStorage.removeItem('pycode_progress');
    localStorage.removeItem('pycode_streak');
    renderApp();
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

// Запуск
initPyodide();
</script>
