<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyCamp: Курс Python в браузере</title>
    <style>
        :root {
            --bg-main: #1e1e1e;
            --bg-panel: #252526;
            --text-main: #cccccc;
            --text-muted: #9cdcfe;
            --accent: #007acc;
            --success: #4ec9b0;
            --error: #f44747;
            --border: #333333;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            display: grid;
            grid-template-rows: auto 1fr;
            height: 100vh;
        }
        header {
            background-color: var(--bg-panel);
            padding: 15px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo { font-size: 1.5em; font-weight: bold; color: var(--accent); }
        .progress { font-size: 0.9em; color: var(--text-muted); }
        main {
            display: grid;
            grid-template-columns: 250px 1fr 300px;
            height: calc(100vh - 56px);
        }
        nav {
            background-color: var(--bg-panel);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            padding: 10px 0;
        }
        .module {
            margin-bottom: 15px;
        }
        .module-title {
            padding: 10px 20px;
            font-weight: bold;
            color: var(--accent);
            cursor: pointer;
            user-select: none;
        }
        .module-title.collapsed + .lessons { display: none; }
        .lesson {
            padding: 8px 40px;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.9em;
        }
        .lesson.active { color: var(--text-main); background-color: #37373d; }
        .lesson.done { color: var(--success); }
        .content {
            background-color: var(--bg-panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }
        .task-panel {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .task-title { font-size: 1.2em; margin-bottom: 10px; }
        .task-desc { font-size: 0.95em; color: var(--text-muted); line-height: 1.5; }
        .editor-container {
            flex-grow: 1;
            padding: 10px;
            position: relative;
        }
        #code-editor {
            width: 100%;
            height: 100%;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 14px;
            background-color: #101010;
            color: #d4d4d4;
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 10px;
            resize: none;
            outline: none;
        }
        .output-panel {
            background-color: var(--bg-main);
            color: var(--success);
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 13px;
            padding: 15px;
            overflow-y: auto;
            border-top: 1px solid var(--border);
        }
        .controls {
            padding: 15px 20px;
            background-color: var(--bg-panel);
            border-top: 1px solid var(--border);
            text-align: right;
        }
        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.95em;
        }
        button:disabled { background-color: #555; cursor: not-allowed; }
        button:hover:not(:disabled) { background-color: #005a9e; }
        .hidden { display: none; }

        /* Базовая подсветка синтаксиса (ключевые слова и строки) */
        .cm-keyword { color: #c586c0; font-weight: bold; }
        .cm-string { color: #ce9178; }
        .cm-comment { color: #6a9955; font-style: italic; }
        .cm-function { color: #dcdcaa; }
        .cm-number { color: #b5cea8; }
    </style>
</head>
<body>

<header>
    <div class="logo">PyCamp</div>
    <div class="progress">Прогресс: <span id="progress-text">0%</span></div>
</header>

<main>
    <!-- Навигация по курсу -->
    <nav id="course-nav">
        <div class="module">
            <div class="module-title" onclick="toggleModule(this)">🐣 Основы</div>
            <div class="lessons">
                <div class="lesson" data-lesson="0" onclick="loadLesson(0)">1. Привет, Мир!</div>
                <div class="lesson" data-lesson="1" onclick="loadLesson(1)">2. Переменные и типы</div>
                <div class="lesson" data-lesson="2" onclick="loadLesson(2)">3. Калькулятор</div>
            </div>
        </div>
        <div class="module">
            <div class="module-title" onclick="toggleModule(this)">🧠 Логика</div>
            <div class="lessons">
                <div class="lesson" data-lesson="3" onclick="loadLesson(3)">4. Условный оператор if</div>
                <div class="lesson" data-lesson="4" onclick="loadLesson(4)">5. Цикл while</div>
                <div class="lesson" data-lesson="5" onclick="loadLesson(5)">6. Списки</div>
            </div>
        </div>
        <div class="module">
            <div class="module-title" onclick="toggleModule(this)">⚙️ Функции</div>
            <div class="lessons">
                <div class="lesson" data-lesson="6" onclick="loadLesson(6)">7. Свои функции</div>
                <div class="lesson" data-lesson="7" onclick="loadLesson(7)">8. Область видимости</div>
            </div>
        </div>
    </nav>

    <!-- Основной контент -->
    <div class="content">
        <div class="task-panel">
            <div class="task-title" id="task-title">Загрузка...</div>
            <div class="task-desc" id="task-desc">Загрузка...</div>
        </div>
        <div class="editor-container">
            <textarea id="code-editor"></textarea>
        </div>
        <div class="controls">
            <button id="run-btn" onclick="runCode()">▶️ Выполнить</button>
            <button id="check-btn" onclick="checkSolution()" disabled>✅ Проверить</button>
        </div>
        <div class="output-panel" id="output-panel"></div>
    </div>

    <!-- Подсказки -->
    <aside class="output-panel">
        <strong>💡 Подсказка</strong>
        <div id="hint-text">Выберите урок слева, чтобы увидеть подсказку.</div>
    </aside>
</main>

<!-- Встроенный CodeMirror (только базовый режим Python для подсветки) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/python/python.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.css">

<script>
/* === Данные курса === */
const lessons = [
    {
        title: "1. Привет, Мир!",
        desc: "Напечатайте в консоль фразу 'Привет, Мир!' с помощью функции print().",
        hint: "Используйте синтаксис print('Ваш текст').",
        initialCode: "print('Привет, Мир!')",
        validator: (output) => output.trim() === "Привет, Мир!"
    },
    {
        title: "2. Переменные и типы",
        desc: "Создайте переменную name со своим именем и переменную age со своим возрастом. Выведите их в консоль.",
        hint: "Присваивание: my_var = 'значение'. Вывод нескольких значений: print(var1, var2).",
        initialCode: "name = 'Алексей'\nage = 25\nprint(name, age)",
        validator: (output) => output.includes("Алексей") && output.includes("25")
    },
    {
        title: "3. Калькулятор",
        desc: "Создайте две переменные a = 100 и b = 20. Выведите на экран их сумму, разность и произведение.",
        hint: "Арифметика: + (сложение), - (вычитание), * (умножение).",
        initialCode: "a = 100\nb = 20\nprint(a + b)\nprint(a - b)\nprint(a * b)",
        validator: (output) => output.includes("120") && output.includes("80") && output.includes("2000")
    },
    {
        title: "4. Условный оператор if",
        desc: "Создайте переменную age. Если age больше или равно 18, выведите 'Доступ разрешен', иначе — 'Доступ запрещен'.",
        hint: "if age >= 18:\n    print('...')\nelse:\n    print('...')",
        initialCode: "age = 20\nif age >= 18:\n    print('Доступ разрешен')\nelse:\n    print('Доступ запрещен')",
        validator: (output) => output.trim() === "Доступ разрешен"
    },
    {
        title: "5. Цикл while",
        desc: "Выведите на экран числа от 1 до 5 включительно, используя цикл while.",
        hint: "Счетчик: i = 1. Условие: while i <= 5:. Не забывайте увеличивать счетчик: i += 1.",
        initialCode: "i = 1\nwhile i <= 5:\n    print(i)\n    i += 1",
        validator: (output) => output.split('\\n').filter(Boolean).join(' ') === "1 2 3 4 5"
    },
    {
        title: "6. Списки",
        desc: "Создайте список fruits с тремя названиями фруктов. Выведите на экран второй элемент списка.",
        hint: "Список: my_list = ['a', 'b', 'c']. Индексация начинается с 0.",
        initialCode: "fruits = ['яблоко', 'банан', 'груша']\nprint(fruits[1])",
        validator: (output) => output.trim() === "банан"
    },
    {
        title: "7. Свои функции",
        desc: "Создайте функцию greet(name), которая принимает имя и выводит 'Привет, {name}!'. Вызовите её для 'Мира'.",
        hint: "def имя_функции(аргументы):\n    # тело функции",
        initialCode: "def greet(name):\n    print('Привет, ' + name + '!')\n\ngreet('Мир')",
        validator: (output) => output.trim() === "Привет, Мир!"
    },
    {
        title: "8. Область видимости",
        desc: "Исправьте код: функция должна изменять глобальную переменную counter, увеличивая её на 1.",
        hint: "Чтобы изменить глобальную переменную внутри функции, используйте ключевое слово global.",
        initialCode: "counter = 0\n\ndef increment():\n    global counter\n    counter += 1\n\nincrement()\nprint(counter)",
        validator: (output) => output.trim() === "1"
    }
];

/* === Состояние приложения === */
let editor;
let currentLesson = 0;
let completedLessons = new Set();

/* === Инициализация === */
window.onload = function() {
    const editorEl = document.getElementById('code-editor');
    editor = CodeMirror.fromTextArea(editorEl, {
        mode: 'python',
        theme: 'default',
        lineNumbers: true,
        indentUnit: 4,
        smartIndent: true,
        matchBrackets: true,
        autofocus: true
    });
    
    loadLesson(0);
    updateProgress();
};

/* === Навигация === */
function toggleModule(element) {
    element.classList.toggle('collapsed');
}

function loadLesson(index) {
    currentLesson = index;
    const lesson = lessons[index];
    
    document.getElementById('task-title').textContent = lesson.title;
    document.getElementById('task-desc').textContent = lesson.desc;
    document.getElementById('hint-text').textContent = lesson.hint;
    
    const saved = localStorage.getItem('lesson_' + index + '_code');
    const codeToLoad = saved || lesson.initialCode;
    editor.setValue(codeToLoad);
    
    // Обновление классов в меню
    document.querySelectorAll('.lesson').forEach(el => el.classList.remove('active', 'done'));
    document.querySelector(`.lesson[data-lesson="${index}"]`).classList.add('active');
    
    completedLessons.forEach(i => {
        document.querySelector(`.lesson[data-lesson="${i}"]`).classList.add('done');
    });
    
    document.getElementById('check-btn').disabled = completedLessons.has(index);
    document.getElementById('output-panel').innerHTML = '<em>Вывод программы появится здесь.</em>';
}

/* === Выполнение кода (в песочнице через Fetch) === */
async function runCode() {
    const code = editor.getValue();
    document.getElementById('output-panel').innerHTML = '<em>Выполнение...</em>';
    
    try {
        const response = await fetch('https://python.josephmisiti.com/execute', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ script: code, priority: 0 })
        });
        
        if (!response.ok) {
            throw new Error('Сервис выполнения кода недоступен');
        }
        
        const data = await response.json();
        
        if (data.success) {
            document.getElementById('output-panel').innerHTML = `<pre>${escapeHtml(data.output || 'Код выполнен без вывода.')}</pre>`;
        } else {
            const errorMsg = data.stderr || data.compileoutput || 'Неизвестная ошибка выполнения.';
            document.getElementById('output-panel').innerHTML = `<pre style="color: var(--error);">Ошибка:\n${escapeHtml(errorMsg)}</pre>`;
        }
    } catch (e) {
        document.getElementById('output-panel').innerHTML = `<pre style="color: var(--error);">Сетевая ошибка: ${e.message}</pre>`;
    }
}

/* === Проверка решения === */
function checkSolution() {
    const code = editor.getValue();
    const lesson = lessons[currentLesson];
    
    document.getElementById('output-panel').innerHTML = '<em>Выполнение для проверки...</em>';
    
    fetch('https://python.josephmisiti.com/execute', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ script: code, priority: 0 })
    })
    .then(r => r.json())
    .then(data => {
        if (!data.success) {
            const errorMsg = data.stderr || data.compileoutput || 'Ошибка в вашем коде.';
            document.getElementById('output-panel').innerHTML = `<pre style="color: var(--error);">Ошибка:\n${escapeHtml(errorMsg)}</pre>`;
            return;
        }
        
        const output = data.output || '';
        if (lesson.validator(output)) {
            document.getElementById('output-panel').innerHTML = '<pre style="color: var(--success);">✅ Решение верно! Урок засчитан.</pre>';
            completedLessons.add(currentLesson);
            localStorage.setItem('lesson_' + currentLesson + '_code', code);
            localStorage.setItem('completed', JSON.stringify([...completedLessons]));
            document.getElementById('check-btn').disabled = true;
            updateProgress();
        } else {
            document.getElementById('output-panel').innerHTML = `<pre style="color: var(--error);">❌ Неверно.\nОжидалось одно поведение, а ваш код вывел:\n${escapeHtml(output)}</pre>`;
        }
    })
    .catch(() => {
        document.getElementById('output-panel').innerHTML = `<pre style="color: var(--error);">Сетевая ошибка при проверке.</pre>`;
    });
}

/* === Утилиты === */
function updateProgress() {
    const progress = Math.round((completedLessons.size / lessons.length) * 100);
    document.getElementById('progress-text').textContent = progress + '%';
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

/* === Восстановление состояния === */
(function restoreState() {
    const saved = localStorage.getItem('completed');
    if (saved) {
        completedLessons = new Set(JSON.parse(saved));
        updateProgress();
    }
})();
</script>
</body>
</html>
